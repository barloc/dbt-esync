# Full YAML schema (T2). Secrets left empty — override via DBT_ESYNC_* env
# (e.g. DBT_ESYNC_SINK__GIT__TOKEN, DBT_ESYNC_SOURCE__QLIK__PASSWORD). Env wins over file.
save_path: bi_qlik_sense
default_owner:
  name: analytics
  email: "@analytics"
  slack: "#analytics"

manifest:
  file: "app/manifest/testdata/manifest.mini.json"
  # url: "https://example.com/manifest.json"  # mutually exclusive with file
  filter_name: starrocks

parse:
  excluded_catalogs: ["main"]
  # schema_allowlist: ["schema_a", "schema_b"]

source:
  type: qlik
  qlik:
    host: qlik.example.com
    user: "DOMAIN\\user"
    password: ""
    datasource: starrocks
    stream_exclude: ["99-Archive", "92-TMP"]
    stream_include: []
    qrc:
      host: qrc.example.com
      cert_b64: ""
      password: ""
      user_directory: inter
      user_id: readonly
    exposure_url_template: "https://qlik.example.com/sense/app/{{.AppID}}"


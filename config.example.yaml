sink:
  git:
    repo_url: "https://git.example.com/org/dbt.git"
    user: bot
    token: "set-via-DBT_ESYNC_SINK__GIT__TOKEN"
    local_path: /tmp/dbt_repo
    exposures_path: dbt/models/exposures
    branch: feature/sync-qlik-exposures
    base_branch: master
  mr:
    enabled: true
    provider: gitlab
    host: "https://git.example.com"

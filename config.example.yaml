# Full YAML schema. Secrets left empty — override via DBT_ESYNC_* env
# (e.g. DBT_ESYNC_SINK__GIT__TOKEN, DBT_ESYNC_SOURCE__0__QLIK__PASSWORD). Env wins over file.
# source is an array: each entry has name (package dir) + type + typed block.
default_owner:
  name: analytics
  email: "@analytics"
  slack: "#analytics"

manifest:
  file: "app/manifest/testdata/manifest.mini.json"
  # url: "https://example.com/manifest.json"  # mutually exclusive with file
  filter_name: starrocks

parse:
  excluded_catalogs: ["main"]
  # schema_allowlist: ["schema_a", "schema_b"]

source:
  - name: bi_qlik_sense
    type: qlik
    qlik:
      # WSS proxy for load scripts (ticket + cookie), not QRS :4242 / Engine :4747
      host: "wss://qlik.example.com/app/"
      user: "DOMAIN\\user"
      password: ""
      datasource: starrocks
      stream_exclude: ["99-Archive", "92-TMP"]
      stream_include: []
      qrc:
        host: "https://qlik.example.com:4242"
        cert_b64: ""
        password: ""
        user_directory: inter
        user_id: readonly
      exposure_url_template: "https://qlik.example.com/sense/app/{{.AppID}}"

